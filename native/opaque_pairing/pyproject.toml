[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "clinx-opaque"
version = "0.1.0"
requires-python = ">=3.11"
description = "CLINX bounded adapter for opaque-ke RFC 9807"
license = "MIT"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "_clinx_opaque"
