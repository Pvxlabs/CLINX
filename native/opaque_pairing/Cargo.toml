[package]
name = "clinx-opaque"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[lib]
name = "_clinx_opaque"
crate-type = ["rlib"]

[dependencies]
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2", "std"] }
sha2 = "=0.10.9"
zeroize = "=1.8.2"
rand = { version = "=0.8.8", features = ["getrandom"] }
