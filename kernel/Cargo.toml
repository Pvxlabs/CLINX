[package]
name = "clinx-decision-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "clinx_decision_kernel"
path = "src/lib.rs"

[[bin]]
name = "clinx-kernel-eval"
path = "src/bin/clinx-kernel-eval.rs"

[[bin]]
name = "clinx-kernel-bench"
path = "src/bin/clinx-kernel-bench.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["float_roundtrip"] }
sha2 = "0.10.9"
sha1 = "=0.10.7"
rustix = { version = "=1.1.5", features = ["net", "process", "time", "event", "fs", "system", "termios"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "hooks"] }
regex = "=1.13.1"
tempfile = "=3.27.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.26"
zeroize = "=1.8.2"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
base64 = "=0.22.1"
x509-parser = { version = "=0.18.1", features = ["verify"] }
hmac = "=0.12.1"
signal-hook = "=0.3.18"

clinx-opaque-core = { package = "clinx-opaque", path = "../native/opaque_pairing", default-features = false }
rcgen = { version = "=0.14.7", features = ["zeroize"] }
ring = "=0.17.14"
time = "=0.3.55"
if-addrs = "=0.15.0"
toml = { version = "=0.9.8", features = ["preserve_order"] }

nix = { version = "=0.30.1", default-features = false, features = ["user", "socket"] }

pkcs8 = { version = "=0.10.2", features = ["pem", "std"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"

[dev-dependencies]
pretty_assertions = "1.4.1"
