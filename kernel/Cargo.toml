[package]
name = "clinx-decision-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "clinx_decision_kernel"
path = "src/lib.rs"

[[bin]]
name = "clinx-kernel-eval"
path = "src/bin/clinx-kernel-eval.rs"

[[bin]]
name = "clinx-kernel-bench"
path = "src/bin/clinx-kernel-bench.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["float_roundtrip"] }
sha2 = "0.10.9"
sha1 = "=0.10.7"
rustix = { version = "=1.1.5", features = ["net", "process", "time", "event", "fs"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
regex = "=1.13.1"
tempfile = "=3.27.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
unicode-casefold = "=0.2.0"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
base64 = "=0.22.1"
x509-parser = { version = "=0.18.1", features = ["verify"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
