name: PVX-1812 isolated repair qualification
on:
  push:
    branches: [fix/pvx1812-completion-handoff]
    paths: [.github/workflows/pvx1812-isolated-review.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply hash-verified candidate and remove temporary bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cat .review/pvx1812-candidate-{1,2,3}.b64 | base64 --decode > "$RUNNER_TEMP/candidate.patch.xz"
          printf '%s  %s\n' f2590d63731e8ca4c1f6844629b24049c034a8329f864d81eb30fb8dc8b8ccd0 "$RUNNER_TEMP/candidate.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/candidate.patch.xz" > "$RUNNER_TEMP/candidate.patch"
          printf '%s  %s\n' 90c807c7f7960e0c5546157f6ba12c7bab04402887d3566c3d45d2e8a5e2bfc9 "$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git rm .review/pvx1812-candidate-{1,2,3}.b64 .github/workflows/pvx1812-isolated-review.yml
          git write-tree > "$RUNNER_TEMP/evidence/tested-tree.txt"
          git diff --cached --stat > "$RUNNER_TEMP/evidence/changed-files.txt"
          cp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/evidence/"
      - name: Prepare explicit Python and Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check pytest==9.0.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          { "$RUNNER_TEMP/venv/bin/python" --version; /usr/bin/python3.12 --version; git --version; rustc --version; cargo --version; } > "$RUNNER_TEMP/evidence/environment.txt"
      - name: Reproduce two baseline completion failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          git archive 1db732a841af906153e2333ece2c85d4450b3daa | tar -x -C "$RUNNER_TEMP/base"
          cp test_pvx1812_completion.py "$RUNNER_TEMP/base/"
          set +e
          (cd "$RUNNER_TEMP/base" && python3 -m pytest -q test_pvx1812_completion.py -k completed_wire_turn_finalizes_without_status_query) > "$RUNNER_TEMP/evidence/baseline-red.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/evidence/baseline-red.txt"
          test "$status" -eq 1
          grep -q '2 failed' "$RUNNER_TEMP/evidence/baseline-red.txt"
      - name: Rust locked qualification and release build
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          {
            cargo fmt --all -- --check
            cargo check --locked
            cargo test --locked
            cargo clippy --all-targets --all-features --locked -- -D warnings
            cargo build --release --locked
          } 2>&1 | tee "$RUNNER_TEMP/evidence/rust.txt"
          sha256sum target/release/clinx-kernel-eval > "$RUNNER_TEMP/evidence/rust-binary-sha256.txt"
      - name: New completion regression and complete Python suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q test_pvx1812_completion.py 2>&1 | tee "$RUNNER_TEMP/evidence/completion-green.txt"
          python3 -m pytest -q 2>&1 | tee "$RUNNER_TEMP/evidence/python-full.txt"
          python3 -m compileall -q .
          git diff --check
          git diff --cached --check
      - name: Existing runtime and kernel qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m runtime_control.qualification --seed 1806 --operations 200 2>&1 | tee "$RUNNER_TEMP/evidence/runtime-qualification.txt"
          python3 -m kernel_lab.qualification 2>&1 | tee "$RUNNER_TEMP/evidence/kernel-qualification.txt"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/evidence/tested-tree.txt")"
      - name: Commit tested repair on isolated branch only
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/pvx1812-completion-handoff
          git config user.name 'CLINX maintenance via ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deliver exact managed completion durably and recover finalization' -m 'PVX-1812 isolated candidate. Scripted-provider/real-SQLite regression and full Linux qualification passed. P620 deployment, original execution recovery, live Provider/Host E2E, and actual per-Provider MCP catalog isolation remain NOT_RUN. No main or production changes.'
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/evidence/tested-tree.txt")"
          header=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/fix/pvx1812-completion-handoff
          unset header PUSH_TOKEN
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/final-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/evidence/final-tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/evidence/clinx-repair-source.tar.gz"
          git bundle create "$RUNNER_TEMP/evidence/clinx-repair.bundle" HEAD
          git diff 1db732a841af906153e2333ece2c85d4450b3daa HEAD --binary > "$RUNNER_TEMP/evidence/repair-from-accepted-base.patch"
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pvx1812-repair-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
