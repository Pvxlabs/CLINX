name: CLINX project quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/kernel/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /data/artifacts
          command -v openssl
      - name: Build current Rust programs and private qualification children
        run: cargo build --locked --manifest-path kernel/Cargo.toml --bins --examples
      - name: Source, documentation and release classification gates
        run: |
          "$CARGO_TARGET_DIR/debug/clinx-source-audit" --check-project
          "$CARGO_TARGET_DIR/debug/clinx-source-audit"
      - name: Native regression in private state
        run: |
          test_root=$(mktemp -d /data/artifacts/ci-XXXXXX)
          mkdir -m 700 "$test_root/home" "$test_root/config" "$test_root/state" "$test_root/data" "$test_root/run" "$test_root/tmp"
          env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" HOME="$test_root/home" XDG_CONFIG_HOME="$test_root/config" XDG_STATE_HOME="$test_root/state" XDG_DATA_HOME="$test_root/data" XDG_RUNTIME_DIR="$test_root/run" TMPDIR="$test_root/tmp" cargo test --locked --manifest-path kernel/Cargo.toml
          cargo test --locked --manifest-path native/opaque_pairing/Cargo.toml
      - name: Build release binaries and package boundary regressions
        run: |
          cargo build --locked --release --manifest-path kernel/Cargo.toml --bins --examples
          cargo test --locked --release --manifest-path kernel/Cargo.toml --test build_release_qualification --test monitor_build --test mcp_relay_retirement --test project_policy
          "$CARGO_TARGET_DIR/release/clinx-source-audit" --check-project
