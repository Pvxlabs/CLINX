# linear-local-codex-bridge v0.1 / Dispatcher V1 M6
#
# Keep LINEAR_API_KEY in the environment, never in this file.

[linear]
team_id = "fb8babe1-9db8-4f19-af10-fb5d116f1374"
trigger_label = "local-codex"
todo_state = "Todo"
running_state = "In Progress"
review_state = "In Review"

# v0.1 uses narrow polling only for the local pilot.
# Linear recommends webhooks for long-running near-real-time integrations.
poll_interval_seconds = 15
max_batch = 1

# Legacy compatibility settings only.  They are not used by Dispatcher V1.
[codex]
binary = "codex"
sandbox = "workspace-write"
approval = "never"

[app_server]
# This is the configured remote transport only. Runtime/target host equality
# selects the local proxy command and never constructs an SSH command.
transport = "ssh"
ssh_alias = "p620"
ssh_binary = "ssh"
ssh_args = ["-T"]
remote_command = ["codex", "app-server", "proxy"]
request_timeout_seconds = 30
client_name = "linear-local-codex-bridge"
client_title = "Linear Local Codex Bridge"
client_version = "1.0.0-m6"

[runtime]
runtime_host = "p620"
log_dir = "~/.local/state/linear-local-codex-bridge"
task_db_path = "~/.local/state/clinx/tasks.sqlite3"

[host_executor]
enabled = true
host = "p620"
default_timeout_seconds = 30
max_timeout_seconds = 120
max_output_bytes = 65536
services = ["clinx.service", "clinx-tunnel.service"]
ssh_targets = ["orion-core", "orion-data"]

[host_executor.network_targets.public_https]
dns_name = "example.com"
url = "https://example.com"
operation_classes = ["READ_ONLY_HOST"]

# M5 dynamic project resolution is bounded to this workspace.  The initial
# qualification target must be a disposable pilot project; real development
# projects are not selected by M5 automatically.
[workspaces.p620]
host = "p620"
root = "/home/pvxlabs/dev"
allow_existing_projects = true
allow_new_projects = false
ssh_alias = "p620"

[projects.pilot]
linear_name = "ChatGPT × Linear × Codex Dispatcher V1"
workspace = "p620"
cwd = "/home/pvxlabs/dev/clinx-pilot"
repository_origin = "git@github.com:Pvxlabs/clinx-disposable-pilot.git"
branch = "main"
read_only = false

[projects.orion]
linear_name = "ORION"
workspace = "p620"
cwd = "/home/pvxlabs/dev/ORION"
repository_origin = "git@github.com:Pvxlabs/ORION.git"
branch = "master"
read_only = true

# CLINX is a local-only self-hosted project on P620.  The missing origin is
# intentional and is part of the identity contract; an unexpected origin is
# a hard failure.
[projects.clinx]
linear_name = "CLINX"
workspace = "p620"
cwd = "/home/pvxlabs/dev/clinx"
branch = "main"
read_only = false
unexpected_origin_policy = "FAIL"

[threads.pilot.current]
host = "p620"
ssh_alias = "p620"
thread_id = "01a07474-014b-7381-a271-db9782ca3e59"
session_id = "01a07474-014b-7381-a271-db9782ca3e59"
app_server_version = "codex-cli 0.152.1"

# The thread binding intentionally contains no cwd, origin, or branch.
# project_id is omitted because the disposable pilot is app-server-unassigned.

# Add later, only after the pilot passes:
#
# [[project]]
# linear_name = "ORION"
# repo = "/Users/tinzleung/github/ORION"
#
# [[project]]
# linear_name = "Terminal"
# repo = "/Users/tinzleung/github/terminal"
[threads.orion.current]
# Identity only; cwd, origin, and branch remain authoritative in projects.orion.
host = "p620"
ssh_alias = "p620"
thread_id = "01a06f30-0ea0-7ea1-bec7-a8292ad8343b"
session_id = "01a06f30-0ea0-7ea1-bec7-a8292ad8343b"
app_server_version = "0.152.1"
